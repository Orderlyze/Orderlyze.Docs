backend:
  name: github
  repo: Orderlyze/Orderlyze.Docs
  branch: main
  base_url: https://ambitious-cliff-0098a0303.2.azurestaticapps.net
  auth_endpoint: /api/auth

local_backend: false

media_folder: static/screenshots
public_folder: /screenshots

locale: 'de'

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: erste-schritte
    label: "Erste Schritte"
    folder: docs/erste-schritte
    create: true
    nested: { depth: 2 }
    slug: "{{slug}}/index"
    path: "{{slug}}/index"
    extension: md
    format: frontmatter
    fields:
      - { name: id, label: ID, widget: string }
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Beschreibung, widget: string }
      - { name: type, label: Typ, widget: string, required: false }
      - { name: platform, label: Plattform, widget: select, options: [web, app, both], required: false }
      - { name: sidebar_position, label: Position, widget: number, default: 1, required: false }
      - { name: navigation, label: Navigation, widget: string, required: false }
      - { name: searchTerms, label: Suchbegriffe, widget: list, required: false }
      - { name: body, label: Inhalt, widget: markdown }

  - name: app
    label: "App"
    folder: docs/app
