<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">IP-Adresse auf dem Selbsttest-Ausdruck</title>
  <desc id="desc">Schematischer Kassenbon. Der Bereich Current IP Parameters Status und die Zeile IP Address sind hervorgehoben.</desc>
  <rect width="960" height="640" fill="#f7f9fb"/>
  <path d="M310 58h340l22 24 22-24 22 24 22-24v524l-22-24-22 24-22-24-22 24H310l-22-24-22 24-22-24-22 24V58l22 24 22-24 22 24z" fill="#ffffff" stroke="#c6ced8" stroke-width="3"/>
  <text x="480" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#202a36">Self-Printing</text>
  <text x="480" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#617080">Printer Information</text>
  <line x1="285" y1="190" x2="675" y2="190" stroke="#d6dce4" stroke-width="3"/>
  <text x="304" y="230" font-family="Courier New, monospace" font-size="20" fill="#576473">Model Name : mC-Print3</text>
  <text x="304" y="266" font-family="Courier New, monospace" font-size="20" fill="#576473">Firmware   : x.xx</text>
  <text x="304" y="302" font-family="Courier New, monospace" font-size="20" fill="#576473">Interface  : LAN</text>
  <rect x="285" y="338" width="390" height="42" rx="4" fill="#fff3bf" stroke="#f1c40f" stroke-width="3"/>
  <text x="480" y="366" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202a36">Current IP Parameters Status</text>
  <rect x="285" y="392" width="390" height="58" rx="4" fill="#d9ecff" stroke="#2477d4" stroke-width="4"/>
  <text x="305" y="428" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#10253d">IP Address : 192.168.1.113</text>
  <text x="304" y="486" font-family="Courier New, monospace" font-size="20" fill="#576473">Subnet Mask: 255.255.255.0</text>
  <text x="304" y="522" font-family="Courier New, monospace" font-size="20" fill="#576473">Gateway    : 192.168.1.1</text>
  <path d="M690 421h120" stroke="#246bfe" stroke-width="5" stroke-linecap="round"/>
  <path d="M810 421l-20-14v28z" fill="#246bfe"/>
  <rect x="718" y="365" width="168" height="42" rx="8" fill="#246bfe"/>
  <text x="802" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Diese IP nutzen</text>
</svg>
